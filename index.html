<!DOCTYPE html>
<html lang="en" data-theme="default" data-focus="engineering">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply the linked or saved theme/emphasis before first paint so tailored links don't flash the
  // Default colours. Mirrors resolveState() in src/state.ts (URL > saved > default).
  // Keep these lists and the storage key in sync with src/types.ts and src/state.ts
  // (tests/prepaint.test.ts checks this).
  (function () {
    var themes = ['default', 'atlassian', 'notion', 'canva', 'stripe', 'linear', 'relevance', 'everlab'];
    var focuses = ['engineering', 'growth', 'balanced'];
    var query = new URLSearchParams(location.search);
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem('jaketb-cv:state') || '{}') || {}; } catch (e) {}
    function pick(key, list) {
      var fromUrl = (query.get(key) || '').toLowerCase();
      if (list.indexOf(fromUrl) > -1) return fromUrl;
      return list.indexOf(saved[key]) > -1 ? saved[key] : null;
    }
    var theme = pick('theme', themes), focus = pick('focus', focuses), root = document.documentElement;
    if (theme) root.dataset.theme = theme;
    if (focus) root.dataset.focus = focus;
  })();
</script>
