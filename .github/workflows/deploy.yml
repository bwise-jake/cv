name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium
      # Both checks run their own `vite build`; they go before the real build so the uploaded
      # dist/ is the one built with the analytics variable below.
      - name: PDF check (every theme × emphasis is exactly 2 A4 pages)
        run: npm run pdf
      - name: Contrast check (WCAG AA for small text in every theme)
        run: npm run check:contrast
      - run: npm run build
        env:
          # Optional: set in repo Settings → Secrets and variables → Actions → Variables.
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
